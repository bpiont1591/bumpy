<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NebulaNest Panel</title>
  <meta name="description" content="Panel konfiguracji reklamy i ustawień serwera NebulaNest." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container panel-wrap">
    <p class="eyebrow">PANEL ADMINA SERWERA</p>
    <h1>NebulaNest - ustawienia promocji</h1>
    <p id="panel-status" class="panel-status">Ładowanie danych...</p>

    <form id="panel-form" class="panel-form hidden">
      <label>
        Opis serwera
        <textarea name="description" rows="4" maxlength="700" placeholder="Opisz klimat, tematykę i społeczność serwera"></textarea>
      </label>

      <label>
        Tytuł reklamy
        <input name="adTitle" type="text" maxlength="120" placeholder="Np. Wbij na aktywną społeczność gamingową" />
      </label>

      <label>
        Treść reklamy
        <textarea name="adBody" rows="5" maxlength="900" placeholder="Krótki tekst reklamowy, który pojawi się na liście"></textarea>
      </label>

      <label>
        Link zaproszenia
        <input name="inviteUrl" type="url" required placeholder="https://discord.gg/..." />
      </label>

      <label>
        Link do bannera
        <input name="bannerUrl" type="url" placeholder="https://..." />
      </label>

      <button class="btn" type="submit">Zapisz zmiany</button>
    </form>
  </main>

  <script src="/panel.js"></script>
</body>
</html>
